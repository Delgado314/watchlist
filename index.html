<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arquivo — cinema pessoal</title>
    <meta name="description" content="Meu arquivo pessoal de cinema: a fila de filmes e onde assistir cada um.">
    <meta name="theme-color" content="#0c0e0d">
    <meta property="og:title" content="Arquivo — cinema pessoal">
    <meta property="og:description" content="Uma coleção particular de filmes para ver, descobrir e guardar.">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0e0d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2386bfae'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip" href="#acervo">Ir para o acervo</a>
    <header class="top">
        <a class="brand" href="./"><span class="dot" aria-hidden="true"></span>Arquivo</a>
        <label class="search"><span class="sr">Buscar título ou diretor</span>
            <input id="q" type="search" placeholder="Buscar título ou diretor  ( / )" autocomplete="off"></label>
    </header>

    <main>
        <section class="intro">
            <h1>Filmes que quero ver,<br>descobrir e guardar.</h1>
            <p id="lede"></p>
            <button id="pick" class="solid" type="button">Sugerir para esta noite</button>
        </section>

        <section class="controls" aria-label="Filtros">
            <div class="chips" id="kinds" role="group" aria-label="Tipo"></div>
            <div class="chips" id="services" role="group" aria-label="Onde assistir"></div>
            <div class="row">
                <label>Década <select id="decade"></select></label>
                <label>Gênero <select id="genre"></select></label>
                <label>Ordem <select id="sort">
                        <option value="added-desc">Adicionados recentemente</option>
                        <option value="added-asc">Esperando há mais tempo</option>
                        <option value="year-desc">Ano ↓</option>
                        <option value="year-asc">Ano ↑</option>
                        <option value="name">Título A–Z</option>
                    </select></label>
                <button id="clear" type="button" hidden>Limpar filtros</button>
                <output id="count" aria-live="polite"></output>
            </div>
        </section>

        <section id="acervo" class="grid" tabindex="-1"></section>
        <p id="empty" class="empty" hidden><strong>Nenhum título com esses critérios.</strong><br>Por enquanto.</p>
    </main>

    <footer><span id="stamp"></span> · Dados: TMDB · Disponibilidade: JustWatch via TMDB</footer>

    <dialog id="modal" aria-labelledby="m-title">
        <button class="x" id="m-close" type="button" aria-label="Fechar">×</button>
        <div class="m-body">
            <div class="m-poster"></div>
            <div class="m-text">
                <h2 id="m-title"></h2>
                <p class="m-meta"></p>
                <p class="m-over"></p>
                <h3>Onde assistir</h3>
                <p class="m-prov"></p>
            </div>
        </div>
    </dialog>
    <script src="app.js" defer></script>
</body>

</html>
